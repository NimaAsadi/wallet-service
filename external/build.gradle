plugins {
    id 'java-library'
}

dependencies {
    api project(':core')
    api project(':base')

    api libs.apacheCommons
    api libs.uuidCreator
    api libs.bundles.httpBundle

    implementation libs.bundles.jacksonBundle
    implementation libs.postgres

    // DI annotations only; dagger-compiler runs exclusively in wallet-app.
    implementation libs.dagger
}

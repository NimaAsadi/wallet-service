pluginManagement {
    repositories {
        maven { url "https://nexus.ebidar.net/repository/maven_ebidar/" }
        gradlePluginPortal()
    }
}
rootProject.name = 'wallet-service'

include(
        "base",
        "core",
        "external",
        "user-info",
        "wallet-app"
)

dependencyResolutionManagement {
    repositories {
        maven { url "https://nexus.ebidar.net/repository/maven_ebidar/" }
        mavenCentral()
    }
    versionCatalogs {
        libs {
            library('springBoot', 'org.springframework.boot', 'spring-boot-starter').withoutVersion()
            library('actuator', 'org.springframework.boot', 'spring-boot-starter-actuator').withoutVersion()
            library('configClient', 'org.springframework.cloud', 'spring-cloud-starter-config').withoutVersion()
            library('dataRedis', 'org.springframework.boot', 'spring-boot-starter-data-redis').withoutVersion()
            library('validation', 'org.springframework.boot', 'spring-boot-starter-validation').withoutVersion()
            library('busRabbit', 'org.springframework.cloud', 'spring-cloud-starter-bus-amqp').withoutVersion()

            library('lombok', 'org.projectlombok', 'lombok').withoutVersion()

            library('common', 'ir.ebb:common:0.0.167')
            library('slerlc', 'ir.ebb.oms:slerlc:3.4.4')
            library('hibernate-jpamodelgen', 'org.hibernate.orm:hibernate-jpamodelgen:6.5.2.Final')
            library('fastjson2', 'com.alibaba.fastjson2:fastjson2:2.0.59')

            library('kafka', 'org.springframework.kafka', 'spring-kafka').version('3.3.10')

            library('dataJpa', 'org.springframework.boot', 'spring-boot-starter-data-jpa').withoutVersion()
            library('postgres', 'org.postgresql', 'postgresql').withoutVersion()
            bundle('postgresBundle', ['dataJpa', 'postgres'])

            library('test', 'org.springframework.boot', 'spring-boot-starter-test').withoutVersion()
            library('testContainers', 'org.springframework.boot', 'spring-boot-testcontainers').withoutVersion()
            library('jupiter', 'org.testcontainers', 'junit-jupiter').withoutVersion()
            library('junitLauncher', 'org.junit.platform', 'junit-platform-launcher').withoutVersion()
            library('junit-params', 'org.junit.jupiter', 'junit-jupiter-params').withoutVersion()
            library('testContainersPostgresql', 'org.testcontainers', 'postgresql').withoutVersion()
            library('assertj', 'org.assertj:assertj-core:3.25.1')
            bundle('testBundle', ['test','jupiter','junitLauncher','testContainers',
                                  'junit-params','testContainersPostgresql','assertj'])

            library('web', 'org.springframework.boot', 'spring-boot-starter-web').withoutVersion()
            library('swagger', 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.14')
            bundle('webBundle', ['web', 'swagger'])

            library('shedlockSpring', 'net.javacrumbs.shedlock', 'shedlock-spring').version('5.13.0')
            library('shedlockJdbcProvider', 'net.javacrumbs.shedlock', 'shedlock-provider-jdbc-template').version('5.13.0')
            bundle('shedlockBundle', ['shedlockSpring', 'shedlockJdbcProvider'])

            library('pekko', 'org.apache.pekko', 'pekko-actor-typed_3').version('1.6.0')
            library('pekkoSlf4j', 'org.apache.pekko', 'pekko-slf4j_3').version('1.6.0')
            bundle('pekkoBundle', ['pekko', 'pekkoSlf4j'])

            library('springRetry', 'org.springframework.retry', 'spring-retry').version('2.0.5')
            library('apacheCommons', 'org.apache.commons:commons-lang3:3.19.0')

            library('oauthResourceServer', 'org.springframework.boot', 'spring-boot-starter-oauth2-resource-server').withoutVersion()
            library('springSecurity', 'org.springframework.boot', 'spring-boot-starter-security').withoutVersion()
            bundle('security', ['oauthResourceServer', 'springSecurity'])

            library('grpcNetty',      'io.grpc', 'grpc-netty-shaded').version('1.76.0')
            library('grpcStub',       'io.grpc', 'grpc-stub').version('1.76.0')
            library('grpcProtobuf',   'io.grpc', 'grpc-protobuf').version('1.76.0')
            library('grpcSpringBoot', 'net.devh:grpc-spring-boot-starter:3.1.0.RELEASE')
            bundle('grpcBundle', ['grpcNetty', 'grpcStub', 'grpcProtobuf', 'grpcSpringBoot'])

            library('quartz', 'org.springframework.boot', 'spring-boot-starter-quartz').withoutVersion()
            library('uuidCreator', 'com.github.f4b6a3', 'uuid-creator').version('6.0.0')
            library('liquibase', 'org.liquibase', 'liquibase-core').withoutVersion()

            library('protobuf', 'com.google.protobuf', 'protobuf-java').version('4.33.0')

            library('httpClient', 'org.apache.httpcomponents.client5', 'httpclient5').withoutVersion()

        }
    }
}

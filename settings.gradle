pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
//        maven { url "https://nexus.ebidar.net/repository/maven_ebidar/" }
    }
}
rootProject.name = 'wallet-service'

include("base", "core", "external", "user-info", "wallet-app")

dependencyResolutionManagement {
    repositories {
        mavenCentral()
//        maven { url "https://nexus.ebidar.net/repository/maven_ebidar/" }
    }
    versionCatalogs {
        libs {
            // ── Pekko (actor model, HTTP, streams) ────────────────────────────────
            version('pekko', '1.6.0')
            version('pekkoHttp', '1.3.0')
            library('pekko', 'org.apache.pekko', 'pekko-actor-typed_3').versionRef('pekko')
            library('pekkoSlf4j', 'org.apache.pekko', 'pekko-slf4j_3').versionRef('pekko')
            library('pekkoStream', 'org.apache.pekko', 'pekko-stream_3').versionRef('pekko')
            library('pekkoHttpCore', 'org.apache.pekko', 'pekko-http-core_3').versionRef('pekkoHttp')
            library('pekkoHttp', 'org.apache.pekko', 'pekko-http_3').versionRef('pekkoHttp')
            library('pekkoHttpJackson', 'org.apache.pekko', 'pekko-http-jackson_3').versionRef('pekkoHttp')
            bundle('pekkoBundle', ['pekko', 'pekkoSlf4j', 'pekkoStream'])
            bundle('httpBundle', ['pekkoHttpCore', 'pekkoHttp', 'pekkoHttpJackson'])

            // ── Pekko Persistence / Sharding / Projection / Cluster (event sourcing) ─
            //    cluster + sharding + persistence/query/serialization match the 1.6.0 train;
            //    persistence-r2dbc (1.1.0), projection-r2dbc (1.1.0) and management (1.1.0) are
            //    the release trains verified compatible with Pekko 1.6.0 / Scala 3.
            library('pekkoClusterTyped', 'org.apache.pekko', 'pekko-cluster-typed_3').versionRef('pekko')
            library('pekkoClusterShardingTyped', 'org.apache.pekko', 'pekko-cluster-sharding-typed_3').versionRef('pekko')
            library('pekkoPersistenceTyped', 'org.apache.pekko', 'pekko-persistence-typed_3').versionRef('pekko')
            library('pekkoPersistenceQuery', 'org.apache.pekko', 'pekko-persistence-query_3').versionRef('pekko')
            library('pekkoSerializationJackson', 'org.apache.pekko', 'pekko-serialization-jackson_3').versionRef('pekko')
            version('pekkoPersistenceR2dbc', '1.1.0')
            library('pekkoPersistenceR2dbc', 'org.apache.pekko', 'pekko-persistence-r2dbc_3').versionRef('pekkoPersistenceR2dbc')
            version('pekkoProjection', '1.1.0')
            library('pekkoProjectionCore', 'org.apache.pekko', 'pekko-projection-core_3').versionRef('pekkoProjection')
            library('pekkoProjectionEventsourced', 'org.apache.pekko', 'pekko-projection-eventsourced_3').versionRef('pekkoProjection')
            library('pekkoProjectionR2dbc', 'org.apache.pekko', 'pekko-projection-r2dbc_3').versionRef('pekkoProjection')
            version('pekkoManagement', '1.1.0')
            library('pekkoMgmtHttp', 'org.apache.pekko', 'pekko-management-cluster-http_3').versionRef('pekkoManagement')
            library('pekkoMgmtBootstrap', 'org.apache.pekko', 'pekko-management-cluster-bootstrap_3').versionRef('pekkoManagement')
            // K8s API node discovery for Cluster Bootstrap (same management 1.1.0 train).
            library('pekkoDiscoveryK8s', 'org.apache.pekko', 'pekko-discovery-kubernetes-api_3').versionRef('pekkoManagement')
            // Persistence testkit for entity/recovery unit tests
            library('pekkoPersistenceTestkit', 'org.apache.pekko', 'pekko-persistence-testkit_3').versionRef('pekko')
            bundle('pekkoClusterBundle', ['pekkoClusterTyped', 'pekkoClusterShardingTyped'])
            bundle('pekkoPersistenceBundle', ['pekkoPersistenceTyped', 'pekkoPersistenceQuery', 'pekkoSerializationJackson', 'pekkoPersistenceR2dbc'])
            bundle('pekkoProjectionBundle', ['pekkoProjectionCore', 'pekkoProjectionEventsourced', 'pekkoProjectionR2dbc'])

            // ── Database drivers ─────────────────────────────────────────────────
            //    PostgreSQL JDBC driver — read-side repos + Liquibase (blocking JDBC/Hikari).
            library('postgres', 'org.postgresql', 'postgresql').version('42.7.4')
            //    PostgreSQL R2DBC driver — pekko-persistence-r2dbc journal/snapshot + projections.
            library('r2dbcPostgres', 'org.postgresql', 'r2dbc-postgresql').version('1.1.1.RELEASE')
            library('hikari', 'com.zaxxer', 'HikariCP').version('5.1.0')
            library('liquibase', 'org.liquibase', 'liquibase-core').version('4.27.0')

            // ── gRPC (plain grpc-java, no spring starter) ─────────────────────────
            version('grpc', '1.76.0')
            library('grpcNetty', 'io.grpc', 'grpc-netty-shaded').versionRef('grpc')
            library('grpcStub', 'io.grpc', 'grpc-stub').versionRef('grpc')
            library('grpcProtobuf', 'io.grpc', 'grpc-protobuf').versionRef('grpc')
            bundle('grpcBundle', ['grpcNetty', 'grpcStub', 'grpcProtobuf'])

            // ── JSON / JWT / validation / logging / utils ─────────────────────────
            version('jackson', '2.17.2')
            library('jacksonDatabind', 'com.fasterxml.jackson.core', 'jackson-databind').versionRef('jackson')
            library('jacksonJsr310', 'com.fasterxml.jackson.datatype', 'jackson-datatype-jsr310').versionRef('jackson')
            bundle('jacksonBundle', ['jacksonDatabind', 'jacksonJsr310'])

            library('nimbusJwt', 'com.nimbusds', 'nimbus-jose-jwt').version('9.40')
            library('cronUtils', 'com.cronutils', 'cron-utils').version('9.2.1')
            library('logback', 'ch.qos.logback', 'logback-classic').version('1.5.6')
            library('kafkaClients', 'org.apache.kafka', 'kafka-clients').version('3.8.1')

            library('lombok', 'org.projectlombok', 'lombok').version('1.18.38')
            library('apacheCommons', 'org.apache.commons', 'commons-lang3').version('3.19.0')
            library('uuidCreator', 'com.github.f4b6a3', 'uuid-creator').version('6.0.0')
            library('protobuf', 'com.google.protobuf', 'protobuf-java').version('4.33.0')

            // ── Test ───────────────────────────────────────────────────────────────
            version('junit', '5.10.3')
            library('junitJupiter', 'org.junit.jupiter', 'junit-jupiter').versionRef('junit')
            library('junitParams', 'org.junit.jupiter', 'junit-jupiter-params').versionRef('junit')
            library('junitLauncher', 'org.junit.platform', 'junit-platform-launcher').version('1.10.3')
            library('assertj', 'org.assertj', 'assertj-core').version('3.25.1')
            version('testcontainers', '1.20.1')
            library('testcontainers', 'org.testcontainers', 'testcontainers').versionRef('testcontainers')
            library('testcontainersPostgresql', 'org.testcontainers', 'postgresql').versionRef('testcontainers')
            library('testcontainersJunit', 'org.testcontainers', 'junit-jupiter').versionRef('testcontainers')
            bundle('testBundle', ['junitJupiter', 'junitParams', 'junitLauncher', 'assertj',
                                  'testcontainers', 'testcontainersPostgresql', 'testcontainersJunit'])
        }
    }
}

plugins {
    id 'java'
    id 'application'
    id 'com.google.protobuf'
}

dependencies {
    implementation project(':core')
    implementation project(':external')
    implementation project(':base')

    implementation libs.bundles.pekkoBundle
    implementation libs.bundles.httpBundle
    implementation libs.bundles.grpcBundle
    implementation libs.bundles.jacksonBundle

    // Cluster + Cluster Bootstrap (management HTTP on :8558) for the bootstrap root.
    // Persistence / projection / sharding-typed APIs arrive transitively from :core (api).
    implementation libs.bundles.pekkoClusterBundle
    implementation libs.pekkoMgmtHttp
    implementation libs.pekkoMgmtBootstrap
    implementation libs.pekkoDiscoveryK8s

    implementation libs.nimbusJwt
    implementation libs.cronUtils
    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'
    implementation libs.kafkaClients
    implementation libs.logback
    implementation libs.uuidCreator
    implementation libs.apacheCommons
    implementation libs.protobuf
    implementation libs.logback
    implementation libs.logstashLogbackEncoder
}

application {
    mainClass = 'ir.ebb.wallet.app.Main'
}

protobuf {
    protoc { artifact = 'com.google.protobuf:protoc:4.33.0' }
    plugins {
        grpc { artifact = 'io.grpc:protoc-gen-grpc-java:1.76.0' }
    }
    generateProtoTasks {
        all()*.plugins { grpc {} }
    }
}

sourceSets {
    main {
        java {
            srcDirs 'build/generated/source/proto/main/grpc'
            srcDirs 'build/generated/source/proto/main/java'
        }
        proto { srcDir 'src/main/proto' }
    }
}

// The protobuf plugin and resources both surface .proto files → dedupe.
processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

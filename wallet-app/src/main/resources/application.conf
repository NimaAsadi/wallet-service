# Pure-Pekko wallet-service configuration (Typesafe Config / HOCON).
# Env overrides use the ${?ENV} idiom layered over defaults.

wallet {
  http {
    port = 8080
    port = ${?SERVER_PORT}
  }
  grpc {
    port = 9090
    port = ${?GRPC_PORT}
  }

  db {
    url = "jdbc:postgresql://localhost:5432/wallet"
    url = ${?DB_URL}
    username = "postgres"
    username = ${?DB_USERNAME}
    password = "postgres"
    password = ${?DB_PASSWORD}
    pool-size = 80
    pool-size = ${?DB_POOL_SIZE}
  }

  kafka {
    bootstrap-servers = "localhost:9092"
    bootstrap-servers = ${?KAFKA_SERVERS}
    topic {
      wallet-state = "wallet.state.updated"
      wallet-state = ${?KAFKA_TOPIC_WALLET_STATE}
      turnover-notification = "wallet.turnover.notification"
      turnover-notification = ${?KAFKA_TOPIC_TURNOVER_NOTIFICATION}
    }
  }

  keycloak {
    user {
      jwk-set-uri = "http://localhost:8180/realms/user/protocol/openid-connect/certs"
      jwk-set-uri = ${?KEYCLOAK_USER_JWK_URI}
    }
    admin {
      jwk-set-uri = "http://localhost:8180/realms/admin/protocol/openid-connect/certs"
      jwk-set-uri = ${?KEYCLOAK_ADMIN_JWK_URI}
    }
    bridge {
      jwk-set-uri = "http://localhost:8180/realms/bridge/protocol/openid-connect/certs"
      jwk-set-uri = ${?KEYCLOAK_BRIDGE_JWK_URI}
    }
  }

  rayan {
    base-url = "https://rayan-gateway.example.com"
    base-url = ${?RAYAN_BASE_URL}
    auth {
      username = ""
      username = ${?RAYAN_USERNAME}
      password = ""
      password = ${?RAYAN_PASSWORD}
      application-key = ""
      application-key = ${?RAYAN_APP_KEY}
    }
    retry {
      max-attempts = 3
      max-attempts = ${?RAYAN_RETRY_MAX_ATTEMPTS}
      delay = 10000
      delay = ${?RAYAN_RETRY_DELAY}
    }
  }

  schedule {
    rayan = "0 30 8 * * MON-FRI"
    rayan = ${?RAYAN_SCHEDULE}
    rayan-backup = "0 0 9 * * MON-FRI"
    rayan-backup = ${?RAYAN_BACKUP_SCHEDULE}
    rayan-remove = "0 0 2 * * *"
    rayan-remove = ${?RAYAN_REMOVE_SCHEDULE}
    turnover-notify = "0 0 20 * * *"
    turnover-notify = ${?TURNOVER_NOTIFY_SCHEDULE}
  }

  credit {
    active = false
    active = ${?CREDIT_ACTIVE}
  }
}

# Blocking dispatcher for read-side JDBC (repositories) and other blocking work.
# Note: r2dbc projections are non-blocking and run on the default dispatcher, so this
# is no longer referenced by projections.
wallet-blocking-dispatcher {
  type = Dispatcher
  executor = "thread-pool-executor"
  thread-pool-executor {
    fixed-pool-size = 48
  }
  throughput = 1
}

# ── Pekko: Cluster + Persistence + Projection + Serialization ─────────────────────
# The wallet is an event-sourced, cluster-sharded entity. The event journal is the
# source of truth; reads are served by CQRS projections over eventsBySlices (R2DBC).
# Node discovery on Kubernetes is via Cluster Bootstrap + the kubernetes-api discovery method.
pekko {
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"
  loglevel = "INFO"

  actor {
    provider = "cluster"

    # Jackson JSON serialization for the wallet protocol. All commands/events/replies/state
    # implement ir.ebb.wallet.wallet.WalletSerializable; this single binding covers them.
    # ActorRef inside commands is handled by the auto-registered PekkoTypedJacksonModule;
    # the concrete record type travels in the manifest (type-in-manifest=on default), so
    # sealed interfaces need no @JsonTypeInfo annotations.
    serialization-bindings {
      "ir.ebb.wallet.wallet.WalletSerializable" = jackson-json
    }
  }

  remote.artery.canonical {
    # Local dev defaults to loopback; in Kubernetes set PEKKO_CANONICAL_HOSTNAME to the
    # pod IP (downward API: status.podIP) so other members can reach this node.
    hostname = "127.0.0.1"
    hostname = ${?PEKKO_CANONICAL_HOSTNAME}
    port = 25520
    port = ${?PEKKO_REMOTE_PORT}
  }

  cluster {
    roles = ["wallet"]

    # Local dev (no Kubernetes): set seed-nodes to self so the 1-member cluster forms
    # and Cluster Bootstrap no-ops. In Kubernetes, leave seed-nodes EMPTY (as shipped) so
    # Cluster Bootstrap forms the cluster via kubernetes-api discovery.
    # seed-nodes = ["pekko://wallet-actor-system@127.0.0.1:25520"]

    # TODO(prod multi-node): configure the SplitBrainResolver (lease strategy over a
    # kubernetes/jdbc lease) instead of relying on the default downing provider.

    sharding {
        number-of-shards = 100000

        passivation {
            strategy = default-strategy
            default-strategy {
                active-entity-limit = 100000
                idle-entity.timeout = 30s
              }
        }
    }

    downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"
  }

  # Pekko Management HTTP (:8558) + Cluster Bootstrap (kubernetes-api discovery).
  management {
    http {
      hostname = "0.0.0.0"
      hostname = ${?PEKKO_MGMT_HOSTNAME}
      port = 8558
      port = ${?PEKKO_MGMT_PORT}
    }
    cluster.bootstrap {
      contact-point-discovery {
        service-name = "wallet-service"
        service-name = ${?K8S_SERVICE_NAME}
        discovery-method = "kubernetes-api"
        required-contact-point-nr = 1
        kubernetes-api {
          # %s is replaced with service-name; pods must carry this label.
          pod-label-selector = "app=%s"
          pod-namespace = "default"
          pod-namespace = ${?K8S_NAMESPACE}
        }
      }
    }
  }

  persistence {
    journal.plugin = "pekko.persistence.r2dbc.journal"
    snapshot-store.plugin = "pekko.persistence.r2dbc.snapshot"
  }

  projection {
    r2dbc {
      dialect = ${pekko.persistence.r2dbc.dialect}
      offset-store {
        schema = "pekko"
        offset-table = "projection_offset_store"
        timestamp-offset-table = "projection_timestamp_offset_store"
        management-table = "projection_management"
      }
    }
    restart-backoff {
      min-backoff = 3s
      max-backoff = 30s
      random-factor = 0.2
    }
  }
}

# ── pekko-persistence-r2dbc: journal + snapshot + projections (reactive, non-blocking) ──
# R2DBC tables live in the `pekko` schema (created by V005__pekko_r2dbc.xml). The connection
# pool is shared by the journal, snapshot store, read journal, and the projections
# (pekko.projection.r2dbc.use-connection-factory).
pekko.persistence.r2dbc {
  dialect = "postgres"
  schema = "pekko"
  connection-factory {
    driver = "postgres"
    host = "localhost"
    host = ${?DB_HOST}
    port = 5432
    port = ${?DB_PORT}
    database = "wallet"
    database = ${?DB_NAME}
    user = ${wallet.db.username}
    password = ${wallet.db.password}
    initial-size = 5
    max-size = 30
    connect-timeout = 3s
    acquire-timeout = 5s
  }
}

# Pure-Pekko wallet-service configuration (Typesafe Config / HOCON).
# Env overrides use the ${?ENV} idiom layered over defaults.

wallet {
  http {
    port = 8080
    port = ${?SERVER_PORT}
  }
  grpc {
    port = 9090
    port = ${?GRPC_PORT}
  }

  db {
    url = "jdbc:postgresql://localhost:5432/wallet"
    url = ${?DB_URL}
    username = "wallet"
    username = ${?DB_USERNAME}
    password = "wallet"
    password = ${?DB_PASSWORD}
    pool-size = 80
    pool-size = ${?DB_POOL_SIZE}
  }

  kafka {
    bootstrap-servers = "localhost:9092"
    bootstrap-servers = ${?KAFKA_SERVERS}
    topic {
      wallet-state = "wallet.state.updated"
      wallet-state = ${?KAFKA_TOPIC_WALLET_STATE}
      turnover-notification = "wallet.turnover.notification"
      turnover-notification = ${?KAFKA_TOPIC_TURNOVER_NOTIFICATION}
    }
  }

  keycloak {
    user {
      jwk-set-uri = "http://localhost:8180/realms/user/protocol/openid-connect/certs"
      jwk-set-uri = ${?KEYCLOAK_USER_JWK_URI}
    }
    admin {
      jwk-set-uri = "http://localhost:8180/realms/admin/protocol/openid-connect/certs"
      jwk-set-uri = ${?KEYCLOAK_ADMIN_JWK_URI}
    }
    bridge {
      jwk-set-uri = "http://localhost:8180/realms/bridge/protocol/openid-connect/certs"
      jwk-set-uri = ${?KEYCLOAK_BRIDGE_JWK_URI}
    }
  }

  rayan {
    base-url = "https://rayan-gateway.example.com"
    base-url = ${?RAYAN_BASE_URL}
    auth {
      username = ""
      username = ${?RAYAN_USERNAME}
      password = ""
      password = ${?RAYAN_PASSWORD}
      application-key = ""
      application-key = ${?RAYAN_APP_KEY}
    }
    retry {
      max-attempts = 3
      max-attempts = ${?RAYAN_RETRY_MAX_ATTEMPTS}
      delay = 10000
      delay = ${?RAYAN_RETRY_DELAY}
    }
  }

  schedule {
    rayan = "0 30 8 * * MON-FRI"
    rayan = ${?RAYAN_SCHEDULE}
    rayan-backup = "0 0 9 * * MON-FRI"
    rayan-backup = ${?RAYAN_BACKUP_SCHEDULE}
    rayan-remove = "0 0 2 * * *"
    rayan-remove = ${?RAYAN_REMOVE_SCHEDULE}
    turnover-notify = "0 0 20 * * *"
    turnover-notify = ${?TURNOVER_NOTIFY_SCHEDULE}
  }

  credit {
    active = false
    active = ${?CREDIT_ACTIVE}
  }
}

# Pekko: blocking dispatcher for DailyWalletActor JDBC calls + slf4j logging.
wallet-blocking-dispatcher {
  type = Dispatcher
  executor = "thread-pool-executor"
  thread-pool-executor {
    fixed-pool-size = 48
  }
  throughput = 1
}

pekko {
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"
  loglevel = "INFO"
}

plugins {
    id 'java'
    id 'com.google.protobuf' version '0.9.4' apply false
}

allprojects {
    group = 'ir.ebb'
    version = '0.0.1'

    repositories {
        mavenCentral()
//        maven {
//            url "https://nexus.ebidar.net/repository/maven_ebidar/"
//        }
    }

    // kafka-clients pulls org.lz4:lz4-java while pekko-serialization-jackson pulls
    // at.yawk.lz4:lz4-java; both advertise the same 'org.lz4:lz4-java' capability, which
    // Gradle cannot auto-resolve between two different modules. Pick one (highest version).
    configurations.configureEach {
        resolutionStrategy.capabilitiesResolution.withCapability('org.lz4:lz4-java') {
            selectHighestVersion()
        }
    }
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    dependencies {
        compileOnly libs.lombok
        annotationProcessor libs.lombok
        testImplementation libs.bundles.testBundle
    }

    tasks.named('test') {
        useJUnitPlatform()
    }

    // -parameters: lets Jackson's ParameterNamesModule map JSON fields to constructor parameters,
    // reducing the annotations needed for Pekko Jackson serialization of messages/events.
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << '-parameters'
    }

    tasks.register("prepareKotlinBuildScriptModel") {}

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}
